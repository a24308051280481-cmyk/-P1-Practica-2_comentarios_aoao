<!-- Dice que es una pagina web -->
<!DOCTYPE html>
<!-- Empieza la pagina en ingles -->
<html lang="en">

<!-- Cosas escondidas de la pagina -->
<head>
    <!-- Para usar acentos y la letra Ñ -->
    <meta charset="UTF-8">
    <!-- Para que se vea bien en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nombre en la pestaña -->
    <title>Imagenes en HTML</title>
<!-- Cierra las cosas escondidas -->
</head>

<!-- Todo lo que se ve en la pantalla -->
<body>
    <!-- Titulo mediano -->
    <h2>Imagenes en HTML</h2>

    <!-- Titulo chico -->
    <h3>Locales</h3>
    <!-- Imagen guardada en la misma carpeta -->
    <img src="caritas.png" alt="Imagen de carita feliz">

    <!-- Hace lo mismo que el titulo chico anterior -->
    <h3>Locales redismensionado</h3>
    <!-- Imagen guardada en carpeta con tamaño cambiado -->
    <img src="imagenes/carita.png" alt="" width="200" height="100">

    <!-- Hace lo mismo que el titulo chico anterior -->
    <h3>Desde internet</h3>
    <!-- Enlace de imagen sacada de internet -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    <!-- Ancho y alto de la imagen -->
    width="200" height="200"
    <!-- Texto si la imagen no se muestra -->
    alt="">

    <!-- Hace lo mismo que el titulo chico anterior -->
    <h3>Animaciones</h3>
    <!-- Imagen con movimiento sacada de internet -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    <!-- Hace lo mismo -->
    width="200" height="200"
    
    alt="">
<!-- Cierra lo que se ve en pantalla -->
</body>

<!-- Cierra toda la pagina -->
</html>
